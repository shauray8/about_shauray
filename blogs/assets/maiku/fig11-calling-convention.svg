<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img"
     aria-label="Decision diagram for calling convention version. Question: does any array argument carry a statically specialized shape dimension, such as maiku's StaticLastDim annotation. If no, the kernel mangles with calling convention Kt1, as linear_mxfp8_fwd does. If yes, the kernel mangles with calling convention Kt2, as mxfp8_quant_fwd does, because its input array uses StaticLastDim.">
  <rect x="0" y="0" width="780" height="260" fill="#12151c"/>
  <defs>
    <marker id="f11a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d7dce6"></path>
    </marker>
  </defs>

  <text x="24" y="26" font-size="12" fill="#d7dce6" fill-opacity="0.7">what actually decides the Kt1 / Kt2 prefix on a mangled kernel symbol</text>

  <!-- question box -->
  <rect x="230" y="46" width="320" height="56" rx="8" fill="#7d859a" fill-opacity="0.14" stroke="#7d859a" stroke-width="1.6"/>
  <text x="390" y="70" font-size="12" fill="#d7dce6" text-anchor="middle">does any array argument carry a</text>
  <text x="390" y="88" font-size="12" fill="#d7dce6" text-anchor="middle">statically-specialized shape dim?</text>

  <line x1="310" y1="102" x2="200" y2="140" stroke="#d7dce6" marker-end="url(#f11a)"/>
  <text x="240" y="118" font-size="11" fill="#d7dce6" fill-opacity="0.8">no</text>
  <line x1="470" y1="102" x2="580" y2="140" stroke="#d7dce6" marker-end="url(#f11a)"/>
  <text x="540" y="118" font-size="11" fill="#d7dce6" fill-opacity="0.8">yes, e.g. StaticLastDim</text>

  <!-- Kt1 branch -->
  <rect x="60" y="140" width="280" height="90" rx="8" fill="#5b9bd5" fill-opacity="0.14" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="200" y="164" font-size="13" fill="#5b9bd5" text-anchor="middle" font-weight="bold">calling convention Kt1</text>
  <text x="200" y="186" font-family="ui-monospace,monospace" font-size="11.5" fill="#d7dce6" text-anchor="middle">_linear_mxfp8_fwd_Kt1_...</text>
  <text x="200" y="206" font-size="10.5" fill="#d7dce6" fill-opacity="0.7" text-anchor="middle">no array argument annotated this way</text>

  <!-- Kt2 branch -->
  <rect x="440" y="140" width="280" height="90" rx="8" fill="#45b5a5" fill-opacity="0.14" stroke="#45b5a5" stroke-width="1.6"/>
  <text x="580" y="164" font-size="13" fill="#45b5a5" text-anchor="middle" font-weight="bold">calling convention Kt2</text>
  <text x="580" y="186" font-family="ui-monospace,monospace" font-size="11.5" fill="#d7dce6" text-anchor="middle">_mxfp8_quant_fwd_Kt2_...</text>
  <text x="580" y="206" font-size="10.5" fill="#d7dce6" fill-opacity="0.7" text-anchor="middle">X: StaticLastDim on its input array</text>

  <text x="390" y="248" font-size="10" fill="#d7dce6" fill-opacity="0.55" text-anchor="middle">the code string is literally "t" + a version enum read straight off the C extension — Kt3 exists in source, behind a dev-features flag, nothing public uses it</text>
</svg>
