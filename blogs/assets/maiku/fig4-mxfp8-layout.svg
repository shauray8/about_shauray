<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
           aria-label="Dual panel diagram. Left panel shows a logical tensor with two 32-element scale blocks, block A in blue and block B in orange, eight of thirty-two elements shown per block. Right panel shows the physical layout: each block's e4m3 element bytes packed together immediately followed by a single e8m0 scale byte, colored to match its logical block, illustrating the blocked scale-factor layout.">
  <rect x="0" y="0" width="900" height="300" fill="#12151c"/>

        <defs>
          <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#d7dce6"></path>
          </marker>
        </defs>

        <text x="210" y="24" text-anchor="middle" font-size="12.5" fill="#d7dce6" font-weight="600">logical tensor</text>
        <text x="210" y="40" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#d7dce6" fill-opacity="0.65">bf16, one row · 8 of 32 elements shown per block</text>

        <!-- block A row -->
        <g id="blockA">
          <rect x="60" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="90" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="120" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="150" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="180" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="210" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="240" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="270" y="60" width="28" height="28" fill="#5b9bd5" fill-opacity="0.55"></rect>
        </g>
        <text x="55" y="79" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="#5b9bd5">block A</text>

        <!-- block B row -->
        <g id="blockB">
          <rect x="60" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="90" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="120" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="150" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="180" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="210" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="240" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="270" y="98" width="28" height="28" fill="#ed9a3c" fill-opacity="0.55"></rect>
        </g>
        <text x="55" y="117" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="#ed9a3c">block B</text>

        <text x="169" y="150" text-anchor="middle" font-size="10.5" fill="#d7dce6" fill-opacity="0.7">32 elements per block share ONE scale</text>

        <!-- divider -->
        <line x1="400" y1="10" x2="400" y2="290" stroke="#d7dce6" stroke-opacity="0.25"></line>

        <text x="660" y="24" text-anchor="middle" font-size="12.5" fill="#d7dce6" font-weight="600">physical layout</text>
        <text x="660" y="40" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#d7dce6" fill-opacity="0.65">CUTLASS blocked scale-factor layout</text>

        <!-- physical block A bytes -->
        <g>
          <rect x="440" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="462" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="484" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="506" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="528" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="550" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="572" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="594" y="60" width="20" height="20" fill="#5b9bd5" fill-opacity="0.55"></rect>
          <rect x="622" y="56" width="28" height="28" rx="3" fill="#5b9bd5" stroke="#d7dce6" stroke-width="1"></rect>
          <text x="636" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#12151c">SA</text>
        </g>
        <text x="440" y="94" font-family="ui-monospace,monospace" font-size="9" fill="#5b9bd5">32× e4m3</text>
        <text x="622" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5b9bd5">e8m0 scale</text>

        <!-- physical block B bytes -->
        <g>
          <rect x="440" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="462" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="484" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="506" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="528" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="550" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="572" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="594" y="140" width="20" height="20" fill="#ed9a3c" fill-opacity="0.55"></rect>
          <rect x="622" y="136" width="28" height="28" rx="3" fill="#ed9a3c" stroke="#d7dce6" stroke-width="1"></rect>
          <text x="636" y="154" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#12151c">SB</text>
        </g>
        <text x="440" y="174" font-family="ui-monospace,monospace" font-size="9" fill="#ed9a3c">32× e4m3</text>
        <text x="622" y="182" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ed9a3c">e8m0 scale</text>

        <!-- mapping arrows, one per block -->
        <path d="M 298 74 C 350 74, 400 70, 438 70" fill="none" stroke="#5b9bd5" marker-end="url(#a4)"></path>
        <path d="M 298 112 C 350 112, 400 150, 438 150" fill="none" stroke="#ed9a3c" marker-end="url(#a4)"></path>

        <text x="536" y="220" text-anchor="middle" font-size="10.5" fill="#d7dce6" fill-opacity="0.8">
          e8m0 byte = biased fp32 exponent of the scale, lifted directly from the bit pattern,
        </text>
        <text x="536" y="236" text-anchor="middle" font-size="10.5" fill="#d7dce6" fill-opacity="0.8">
          no MUFU.lg2 / MUFU.ex2. Checkable in SASS (§5b).
        </text>
      </svg>
