<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
           aria-label="Two flow diagrams. Before: an interleaved input tensor is split by two contiguous copy kernels, gate and up, each copying M times N elements, before reaching the SwiGLU kernel and output, totaling 135.8 microseconds at 4096 by 3840. After: the same input reaches the SwiGLU kernel directly through a strided load with zero extra bytes copied, totaling 24.8 microseconds.">
  <rect x="0" y="0" width="900" height="300" fill="#12151c"/>

        <defs>
          <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#d7dce6"></path>
          </marker>
          <marker id="a5r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#d95555"></path>
          </marker>
          <marker id="a5g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#5fb85f"></path>
          </marker>
        </defs>

        <text x="10" y="18" font-family="ui-monospace,monospace" font-size="11" fill="#d95555" font-weight="600">BEFORE</text>

        <!-- before: input -->
        <rect x="10" y="52" width="140" height="46" rx="7" fill="none" stroke="#d7dce6"></rect>
        <text x="80" y="72" text-anchor="middle" font-size="10.5" fill="#d7dce6">[M, 2N] interleaved</text>
        <text x="80" y="87" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d7dce6" fill-opacity="0.6">bf16, one buffer</text>

        <!-- before: two copy kernels -->
        <rect x="220" y="10" width="200" height="42" rx="7" fill="#d95555" fill-opacity="0.14" stroke="#d95555" stroke-width="1.4"></rect>
        <text x="320" y="27" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#d7dce6">gate = x[:, :n].contiguous()</text>
        <text x="320" y="42" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d95555">+M·N elements copied</text>

        <rect x="220" y="94" width="200" height="42" rx="7" fill="#d95555" fill-opacity="0.14" stroke="#d95555" stroke-width="1.4"></rect>
        <text x="320" y="111" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#d7dce6">up = x[:, n:].contiguous()</text>
        <text x="320" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d95555">+M·N elements copied</text>

        <!-- before: kernel -->
        <rect x="480" y="52" width="150" height="46" rx="7" fill="none" stroke="#d7dce6"></rect>
        <text x="555" y="72" text-anchor="middle" font-size="10.5" fill="#d7dce6">SwiGLU kernel</text>
        <text x="555" y="87" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d7dce6" fill-opacity="0.6">24.8 µs, unchanged</text>

        <!-- before: output -->
        <rect x="690" y="52" width="120" height="46" rx="7" fill="none" stroke="#d7dce6"></rect>
        <text x="750" y="79" text-anchor="middle" font-size="10.5" fill="#d7dce6">Output</text>

        <!-- before arrows -->
        <line x1="150" y1="66" x2="216" y2="31" stroke="#d7dce6" marker-end="url(#a5)"></line>
        <line x1="150" y1="84" x2="216" y2="115" stroke="#d7dce6" marker-end="url(#a5)"></line>
        <line x1="420" y1="31" x2="478" y2="65" stroke="#d95555" marker-end="url(#a5r)"></line>
        <line x1="420" y1="115" x2="478" y2="81" stroke="#d95555" marker-end="url(#a5r)"></line>
        <line x1="630" y1="75" x2="688" y2="75" stroke="#d7dce6" marker-end="url(#a5)"></line>

        <text x="450" y="160" text-anchor="middle" font-size="11" fill="#d95555">≈63 MB of copy in front of the kernel: 135.8 µs total, 4096×3840</text>

        <!-- divider -->
        <line x1="0" y1="185" x2="900" y2="185" stroke="#d7dce6" stroke-opacity="0.2" stroke-dasharray="3 3"></line>

        <text x="10" y="205" font-family="ui-monospace,monospace" font-size="11" fill="#5fb85f" font-weight="600">AFTER</text>

        <!-- after: input -->
        <rect x="10" y="222" width="140" height="46" rx="7" fill="none" stroke="#d7dce6"></rect>
        <text x="80" y="242" text-anchor="middle" font-size="10.5" fill="#d7dce6">[M, 2N] interleaved</text>
        <text x="80" y="257" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d7dce6" fill-opacity="0.6">bf16, one buffer</text>

        <!-- after: kernel -->
        <rect x="480" y="222" width="150" height="46" rx="7" fill="none" stroke="#d7dce6"></rect>
        <text x="555" y="242" text-anchor="middle" font-size="10.5" fill="#d7dce6">SwiGLU kernel</text>
        <text x="555" y="257" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d7dce6" fill-opacity="0.6">24.8 µs, unchanged</text>

        <!-- after: output -->
        <rect x="690" y="222" width="120" height="46" rx="7" fill="none" stroke="#d7dce6"></rect>
        <text x="750" y="249" text-anchor="middle" font-size="10.5" fill="#d7dce6">Output</text>

        <!-- after arrows -->
        <line x1="150" y1="245" x2="478" y2="245" stroke="#5fb85f" marker-end="url(#a5g)"></line>
        <text x="314" y="238" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5fb85f">strided ct.load, 0 extra bytes</text>
        <line x1="630" y1="245" x2="688" y2="245" stroke="#d7dce6" marker-end="url(#a5)"></line>

        <text x="450" y="292" text-anchor="middle" font-size="11" fill="#5fb85f">0 MB of copy: 24.8 µs total, same shape, same kernel</text>
      </svg>
