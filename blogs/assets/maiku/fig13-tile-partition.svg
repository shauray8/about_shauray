  <text x="76" y="238" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">registers / thread</text>
  <text x="384" y="238" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">128</text>
  <text x="76" y="268" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">shared mem / CTA</text>
  <text x="384" y="268" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">46 KB</text>
  <text x="76" y="297" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">local mem spill</text>
  <text x="384" y="297" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">none</text>
  <text x="76" y="327" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">QMMA.SF / K-loop</text>
  <text x="384" y="327" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">128</text>
  <text x="76" y="356" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">latency</text>
  <text x="384" y="356" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">96.2 &#956;s</text>
  <text x="600" y="36" font-family="Excalifont" font-size="20" fill="#f0b3b2">loser: tile_n=256, 2 CTAs, CGA cluster</text>
  <text x="600" y="58" font-family="monospace" font-size="12" fill="#d7dce6" fill-opacity="0.55">tile_n = 256 (split 128 + 128)</text>
  <path d="M660,98 Q790,80 920,98" stroke="#7d859a" stroke-width="1.4" fill="none"/>
