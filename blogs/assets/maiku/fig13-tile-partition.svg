  <text x="230" y="147" font-family="monospace" font-size="13" fill="#a9e0a9" text-anchor="middle" font-weight="bold">CTA 0</text>
  <text x="230" y="192" font-family="Excalifont" font-size="13" fill="#d7dce6" fill-opacity="0.6" text-anchor="middle">occupancy 2, unclustered</text>
  <rect x="60" y="212" width="340" height="168" rx="8" fill="#0d0f14" fill-opacity="0.55" stroke="none"/>
