  <text x="944" y="238" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">168</text>
  <text x="636" y="268" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">shared mem / CTA</text>
  <text x="944" y="268" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">68 KB</text>
  <text x="636" y="297" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">local mem spill</text>
  <text x="944" y="297" font-family="monospace" font-size="12.5" fill="#f0d9a9" font-weight="bold" text-anchor="end">344 words</text>
  <text x="636" y="327" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">QMMA.SF / K-loop</text>
  <text x="944" y="327" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">192</text>
  <text x="636" y="356" font-family="monospace" font-size="12.5" fill="#d7dce6" fill-opacity="0.7">latency</text>
  <text x="944" y="356" font-family="monospace" font-size="12.5" fill="#d7dce6"  text-anchor="end">132.5 &#956;s</text>
  <path d="M999.44,272.05 Q984.90,281.77 967.58,293.66" stroke="#e0b96f" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M975.52,292.69 Q971.71,292.93 967.70,293.01" stroke="#e0b96f" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <path d="M971.55,299.50 Q970.56,296.71 968.75,293.24" stroke="#e0b96f" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <text x="1004" y="268" font-family="Excalifont" font-size="12" fill="#f0d9a9">runs out of</text>
  <text x="1004" y="284" font-family="Excalifont" font-size="12" fill="#f0d9a9">room first</text>
  <text x="540" y="410" font-family="Excalifont" font-size="16" fill="#d7dce6" fill-opacity="0.9" text-anchor="middle">same GEMM, same card &#8212; the wider clustered tile keeps more state live per CTA,</text>
  <text x="540" y="434" font-family="Excalifont" font-size="16" fill="#d7dce6" fill-opacity="0.9" text-anchor="middle">and this kernel hits the register file before the cluster ever pays for itself</text>
  </svg>