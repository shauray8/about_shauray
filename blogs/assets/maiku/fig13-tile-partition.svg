<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img"
     aria-label="Two real linear_mxfp8 GEMM tile configurations on the same card. Left, the winning config: a 128-wide tile assigned to one CTA, no CGA cluster, 128 registers per thread, 46 kilobytes shared memory per CTA, no spill, 128 QMMA.SF instructions per K-loop, 96.2 microseconds. Right, the losing config: a 256-wide tile split into two 128-wide halves across two CTAs joined in a CGA cluster over the SM-to-SM interconnect, 168 registers per thread, 68 kilobytes shared memory per CTA, 344 words spilled to local memory, 192 QMMA.SF instructions per K-loop, 132.5 microseconds. The wider clustered tile is slower because it runs out of register and shared memory room before the cluster's occupancy benefit ever applies.">
  <defs>
    <style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }
    </style>
  </defs>
  <rect x="0" y="0" width="1080" height="500" fill="#12151c"/>

  <text x="40" y="36" font-family="Excalifont" font-size="20" fill="#a9e0a9">winner: tile_n=128, 1 CTA, no cluster</text>
  <text x="40" y="58" font-family="monospace" font-size="12" fill="#d7dce6" fill-opacity="0.55">tile_n = 128</text>
