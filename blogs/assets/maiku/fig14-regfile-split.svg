<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img"
     aria-label="Two real per-thread register-file splits by warp-group, drawn to the same proportions. Top, linear_mxfp8 on this card: the compiler's SASS branches on a warp-group id and drops one warp-group to 32 registers while letting another climb to 224 registers, with no request for this in the kernel's Python source. Bottom, Colfax's hand-written NVFP4 GEMM on the same card: one TMA load warp is explicitly dropped to 40 registers while eight MMA warps are explicitly grown to 232, written directly into the CuTe source. The two splits are nearly the same shape: the load warp is starved and the compute warps are fed, one arrived at automatically, the other by hand.">
  <defs>
    <style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="480" fill="#12151c"/>

  <text x="90" y="46" font-family="Excalifont" font-size="19" fill="#d7dce6" fill-opacity="0.92">linear_mxfp8 &#8212; compiler-inferred split, no Python request</text>
  <rect x="90" y="76" width="107.5" height="76" rx="8" fill="#e0b96f" fill-opacity="0.22" stroke="none"/>
  <path d="M99.10,77.17 L190.52,74.92 Q197.53,76.61 197.74,83.80 L197.58,143.04 Q197.13,150.85 188.70,151.86 L97.27,151.88 Q90.74,152.23 88.76,142.92 L90.55,83.80 Q90.41,76.31 99.10,77.17" stroke="#e0b96f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M99.22,75.64 L190.18,75.66 Q198.32,75.21 197.69,84.42 L197.02,142.92 Q196.50,150.96 189.43,152.57 L98.24,151.86 Q88.80,151.42 90.37,143.17 L89.16,83.54 Q90.19,76.83 99.22,75.64" stroke="#e0b96f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="197.5" y="76" width="752.5" height="76" rx="8" fill="#5fb85f" fill-opacity="0.18" stroke="none"/>
  <path d="M205.06,75.66 L941.45,75.49 Q949.13,77.24 950.72,84.13 L949.37,142.98 Q948.85,151.78 942.74,152.54 L206.35,151.32 Q196.26,152.80 197.62,145.09 L197.74,85.16 Q197.99,77.23 205.06,75.66" stroke="#5fb85f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206.29,77.17 L942.10,77.27 Q950.08,75.14 950.65,83.60 L951.23,143.68 Q950.11,152.81 941.20,150.90 L205.41,151.21 Q196.86,151.80 198.63,145.17 L196.76,82.97 Q198.54,75.86 206.29,77.17" stroke="#5fb85f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198.00,82.63 Q197.25,114.63 197.80,145.86" stroke="#7d859a" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M197.72,81.58 Q197.81,114.53 197.17,145.86" stroke="#7d859a" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <text x="144" y="110" font-family="monospace" font-size="14" fill="#f0d9a9" text-anchor="middle" font-weight="bold">32 regs</text>
  <text x="144" y="128" font-family="Excalifont" font-size="11" fill="#f0d9a9" fill-opacity="0.85" text-anchor="middle">load warp-group</text>
  <text x="574" y="110" font-family="monospace" font-size="14" fill="#a9e0a9" text-anchor="middle" font-weight="bold">224 regs</text>
  <text x="574" y="128" font-family="Excalifont" font-size="11" fill="#a9e0a9" fill-opacity="0.85" text-anchor="middle">compute warp-group</text>
  <text x="144" y="66" font-family="monospace" font-size="10.5" fill="#d7dce6" fill-opacity="0.55" text-anchor="middle">USETMAXREG.DEALLOC.CTAPOOL</text>
  <text x="574" y="66" font-family="monospace" font-size="10.5" fill="#d7dce6" fill-opacity="0.55" text-anchor="middle">USETMAXREG.TRY_ALLOC.CTAPOOL</text>
  <text x="90" y="204" font-family="monospace" font-size="11.5" fill="#d7dce6" fill-opacity="0.55">branch on warp-group id (UR16)</text>
  <text x="90" y="266" font-family="Excalifont" font-size="19" fill="#d7dce6" fill-opacity="0.92">Colfax NVFP4 GEMM &#8212; hand-written split, same card</text>
  <rect x="90" y="296" width="126.47058823529412" height="76" rx="8" fill="#e0b96f" fill-opacity="0.22" stroke="none"/>
  <path d="M98.71,296.15 L208.60,296.85 Q216.39,295.87 215.45,304.34 L216.04,364.15 Q217.04,370.71 209.34,371.35 L99.17,370.90 Q89.68,372.74 90.16,364.11 L89.31,304.16 Q89.07,296.96 98.71,296.15" stroke="#e0b96f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M97.23,296.47 L207.62,295.87 Q217.42,295.99 216.27,302.91 L216.99,363.95 Q217.19,372.45 208.96,372.10 L98.15,372.07 Q90.27,371.46 89.47,365.04 L88.92,304.98 Q89.53,295.61 97.23,296.47" stroke="#e0b96f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216.47058823529412" y="296" width="733.5294117647059" height="76" rx="8" fill="#5fb85f" fill-opacity="0.18" stroke="none"/>
  <path d="M223.96,297.20 L941.59,295.71 Q949.90,295.01 949.79,304.82 L949.94,364.14 Q950.17,371.85 941.36,371.42 L223.40,371.26 Q217.40,371.37 215.86,364.92 L216.48,302.99 Q217.38,295.34 223.96,297.20" stroke="#5fb85f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M225.73,296.35 L940.81,296.80 Q949.14,297.24 949.42,303.64 L949.08,364.88 Q951.07,371.17 940.93,372.62 L224.20,372.47 Q215.22,372.29 215.93,362.90 L217.55,304.40 Q215.53,296.60 225.73,296.35" stroke="#5fb85f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M216.58,302.43 Q216.42,334.33 216.99,366.16" stroke="#7d859a" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M215.89,301.35 Q216.62,333.72 217.04,365.53" stroke="#7d859a" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <text x="153" y="330" font-family="monospace" font-size="14" fill="#f0d9a9" text-anchor="middle" font-weight="bold">40 regs</text>
  <text x="153" y="348" font-family="Excalifont" font-size="11" fill="#f0d9a9" fill-opacity="0.85" text-anchor="middle">TMA load warp</text>
  <text x="583" y="330" font-family="monospace" font-size="14" fill="#a9e0a9" text-anchor="middle" font-weight="bold">232 regs</text>
  <text x="583" y="348" font-family="Excalifont" font-size="11" fill="#a9e0a9" fill-opacity="0.85" text-anchor="middle">8 MMA warps</text>
  <text x="153" y="286" font-family="monospace" font-size="10.5" fill="#d7dce6" fill-opacity="0.55" text-anchor="middle">setmaxregister_decrease</text>
  <text x="583" y="286" font-family="monospace" font-size="10.5" fill="#d7dce6" fill-opacity="0.55" text-anchor="middle">setmaxregister_increase</text>
  <text x="90" y="424" font-family="monospace" font-size="11.5" fill="#d7dce6" fill-opacity="0.55">written directly into the CuTe source</text>
  <text x="520" y="460" font-family="Excalifont" font-size="15" fill="#d7dce6" fill-opacity="0.85" text-anchor="middle">same shape either way, one arrived at by the compiler, the other written by hand</text>
  </svg>