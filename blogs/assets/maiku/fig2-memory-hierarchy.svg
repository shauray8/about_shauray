<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"
           aria-label="Funnel diagram of the SM120 memory hierarchy: registers at 256 kilobytes per SM narrowest and fastest at top, shared memory and L1 at roughly 228 kilobytes per SM, L2 cache at 128 megabytes shared across the device, and HBM at 95 gigabytes and about 1792 gigabytes per second widest and slowest at bottom.">
  <rect x="0" y="0" width="760" height="400" fill="#12151c"/>

        <defs>
          <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#d7dce6"></path>
          </marker>
        </defs>

        <!-- axis -->
        <line x1="28" y1="26" x2="28" y2="330" stroke="#d7dce6" stroke-opacity="0.5" marker-end="url(#a2)"></line>
        <line x1="28" y1="330" x2="28" y2="26" stroke="#d7dce6" stroke-opacity="0.5" marker-end="url(#a2)"></line>
        <text x="14" y="24" font-size="10" fill="#d7dce6" fill-opacity="0.7" transform="rotate(-90 14 24)" text-anchor="end">faster · smaller</text>
        <text x="14" y="340" font-size="10" fill="#d7dce6" fill-opacity="0.7" transform="rotate(-90 14 340)" text-anchor="end">slower · bigger</text>

        <!-- registers -->
        <rect x="250" y="20" width="260" height="60" rx="8" fill="#5b9bd5" fill-opacity="0.16" stroke="#5b9bd5" stroke-width="1.6"></rect>
        <text x="380" y="46" text-anchor="middle" font-size="13" fill="#d7dce6">Registers</text>
        <text x="380" y="64" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#5b9bd5">256 KB / SM · 65,536 × 32-bit</text>

        <!-- shared / L1 -->
        <rect x="190" y="100" width="380" height="60" rx="8" fill="#45b5a5" fill-opacity="0.16" stroke="#45b5a5" stroke-width="1.6"></rect>
        <text x="380" y="126" text-anchor="middle" font-size="13" fill="#d7dce6">Shared memory / L1</text>
        <text x="380" y="144" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#45b5a5">~228 KB / SM usable</text>

        <!-- L2 -->
        <rect x="110" y="180" width="540" height="60" rx="8" fill="#e0b828" fill-opacity="0.16" stroke="#e0b828" stroke-width="1.6"></rect>
        <text x="380" y="206" text-anchor="middle" font-size="13" fill="#d7dce6">L2 cache, shared across all 188 SMs</text>
        <text x="380" y="224" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#e0b828">128 MB</text>

        <!-- HBM -->
        <rect x="30" y="260" width="700" height="60" rx="8" fill="#9d6eb5" fill-opacity="0.16" stroke="#9d6eb5" stroke-width="1.6"></rect>
        <text x="380" y="286" text-anchor="middle" font-size="13" fill="#d7dce6">Device memory (GDDR7)</text>
        <text x="380" y="304" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#9d6eb5">95 GB · ~1792 GB/s peak</text>

        <text x="380" y="356" text-anchor="middle" font-size="11.5" fill="#d7dce6" fill-opacity="0.75">
          At DiT working-set sizes, a 4096×4096 bf16 tensor is 33 MB, often resident entirely in L2.
        </text>
        <text x="380" y="374" text-anchor="middle" font-size="11.5" fill="#d7dce6" fill-opacity="0.75">
          "&gt;100% of HBM peak" in a benchmark table almost always means this row, not the one below it.
        </text>
      </svg>
